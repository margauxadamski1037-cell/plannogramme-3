function makeImg(key) {
  const img = document.createElement('img');
  img.src = 'data:image/png;base64,' + IMAGES[key];
  img.draggable = false;
  return img;

  badge.className = 'badge';
  badge.textContent = p.ref;
  card.appendChild(badge);
  card.addEventListener('pointerdown', e => startDrag(e, p, null));
  return card;
}

function renderPalette() {
  palette.innerHTML = '';
  PRODUCTS.forEach(p => {
    if (!placed[p.id]) palette.appendChild(makePaletteCard(p));
  });
}

function makePlaced(p, x, y) {
  const el = document.createElement('div');
  el.className = 'placed';
  el.dataset.id = p.id;
  el.appendChild(makeImg(p.key));
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = p.name;
  el.appendChild(label);
  el.style.left = x + '%';
  el.style.top = y + '%';
  el.addEventListener('pointerdown', e => startDrag(e, p, el));
  board.appendChild(el);
  placed[p.id] = {el, x, y};
  return el;
}

function startDrag(e, p, existing) {
  e.preventDefault();
  const rect = board.getBoundingClientRect();
  const sourceRect = (existing || e.currentTarget).getBoundingClientRect();

  if (!existing) {
    // Start new item from palette: create it near the top-center, then drag.
    const x = Math.max(1, Math.min(90, ((e.clientX - rect.left) / rect.width)*100 - 3));
    const y = Math.max(1, Math.min(90, ((e.clientY - rect.top) / rect.height)*100 - 3));
    existing = makePlaced(p, x, y);
    renderPalette();
  }

  const itemRect = existing.getBoundingClientRect();
  const offsetX = e.clientX - itemRect.left;
  const offsetY = e.clientY - itemRect.top;
  drag = {p, el: existing, offsetX, offsetY};
  existing.classList.add('dragging');
  existing.setPointerCapture(e.pointerId);
  existing.addEventListener('pointermove', onMove);
  existing.addEventListener('pointerup', onUp, {once:true});
}

function onMove(e) {
  if (!drag) return;
  const rect = board.getBoundingClientRect();
  const item = drag.el;
  let leftPx = e.clientX - rect.left - drag.offsetX;
  let topPx = e.clientY - rect.top - drag.offsetY;
  const maxLeft = rect.width - item.offsetWidth;
  const maxTop = rect.height - item.offsetHeight;
  leftPx = Math.max(0, Math.min(maxLeft, leftPx));
  topPx = Math.max(0, Math.min(maxTop, topPx));
  item.style.left = (leftPx/rect.width*100) + '%';
  item.style.top = (topPx/rect.height*100) + '%';
}

function onUp(e) {
  if (!drag) return;
  drag.el.classList.remove('dragging');
  drag.el.removeEventListener('pointermove', onMove);
  const rect = board.getBoundingClientRect();
  const x = parseFloat(drag.el.style.left);
  const y = parseFloat(drag.el.style.top);
  placed[drag.p.id].x = x;
  placed[drag.p.id].y = y;
  drag = null;
}

function zoneOf(el) {
  const rect = board.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const cx = (r.left + r.width/2 - rect.left) / rect.width * 100;
  const cy = (r.top + r.height/2 - rect.top) / rect.height * 100;
  if (cx >= 17 && cx <= 93 && cy >= 20 && cy <= 36) return 'A';
  if (cx >= 5 && cx <= 19 && cy >= 40 && cy <= 77) return 'B';
  if (cx >= 23 && cx <= 59 && cy >= 40 && cy <= 75) return 'C';
  if (cx >= 61 && cx <= 73 && cy >= 40 && cy <= 79) return 'D';
  return null;
}

document.getElementById('check').addEventListener('click', () => {
  let total = 0, good = 0;
  PRODUCTS.forEach(p => {
    const obj = placed[p.id];
    if (!obj) return;
    total++;
    const z = zoneOf(obj.el);
    obj.el.classList.remove('correct','wrong');
    if (z === p.zone) { good++; obj.el.classList.add('correct'); }
    else obj.el.classList.add('wrong');
  });
  if (total < PRODUCTS.length) {
    status.style.color = '#e30613';
    status.textContent = `Il reste ${PRODUCTS.length-total} produit(s) à placer.`;
  } else if (good === PRODUCTS.length) {
    status.style.color = '#20a447';
    status.textContent = `Bravo ! Les ${good} / ${PRODUCTS.length} produits sont correctement rangés.`;
  } else {
    status.style.color = '#e30613';
    status.textContent = `${good} / ${PRODUCTS.length} produits sont correctement rangés. Les produits en rouge sont à déplacer.`;
  }
});

document.getElementById('reset').addEventListener('click', () => {
  placed = {};
  board.querySelectorAll('.placed').forEach(e => e.remove());
  status.textContent = '';
  renderPalette();
});

renderPalette();
</script>
</body>
</html>
